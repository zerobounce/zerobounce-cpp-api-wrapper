# Build and run Google Test suite on every PR.
name: SDK CI

on:
  # Started by dependabot-auto-merge.yml after it merges: a merge made with GITHUB_TOKEN
  # starts no push workflows.
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev

      - name: Configure and build
        run: cmake -S . -B build -G "Unix Makefiles" && cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Build as a FetchContent consumer
        # A project that pulls this repository in with FetchContent links the
        # library only: it must not fetch googletest or define the test target.
        # The parent build's _deps are reused so nothing is downloaded twice.
        run: |
          deps="$GITHUB_WORKSPACE/build/_deps"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(ZeroBounceConsumer LANGUAGES CXX)
          include(FetchContent)
          FetchContent_Declare(zerobounce GIT_REPOSITORY https://example.invalid/zerobounce.git)
          FetchContent_MakeAvailable(zerobounce)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ZeroBounce)
          EOF
          cat > "$consumer/main.cpp" <<'EOF'
          #include "ZeroBounce/ZeroBounce.h"

          int main() {
              ZeroBounce *(*instance)() = &ZeroBounce::getInstance;
              return instance == nullptr;
          }
          EOF
          cmake -S "$consumer" -B "$consumer/build" -G "Unix Makefiles" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_ZEROBOUNCE="$GITHUB_WORKSPACE" \
            -DFETCHCONTENT_SOURCE_DIR_CURL="$deps/curl-src" \
            -DFETCHCONTENT_SOURCE_DIR_CPR="$deps/cpr-src" \
            -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$deps/nlohmann_json-src"
          cmake --build "$consumer/build" --target consumer
          # Look for the cache entry of a FetchContent_MakeAvailable of googletest:
          # it exists only when the library's top-level guard is gone.
          if [ ! -f "$consumer/build/CMakeCache.txt" ]; then
            echo "::error::The FetchContent consumer has no CMakeCache.txt."
            exit 1
          fi
          if grep -E 'FETCHCONTENT_SOURCE_DIR_GOOGLETEST' "$consumer/build/CMakeCache.txt"; then
            echo "::error::A FetchContent consumer fetched googletest."
            exit 1
          fi
          if ! targets=$(cmake --build "$consumer/build" --target help); then
            echo "::error::cmake --build --target help failed in the FetchContent consumer."
            exit 1
          fi
          if printf '%s\n' "$targets" | grep -E 'ZeroBounceTests'; then
            echo "::error::A FetchContent consumer defines a test target."
            exit 1
          fi

  test-min-cmake:
    # Builds and tests with the oldest CMake the project supports, matching
    # cmake_minimum_required(VERSION 3.20) in CMakeLists.txt (ctest --test-dir
    # is also new in 3.20). 3.20.2 is the oldest 3.20 release on PyPI.
    name: Test (minimum CMake 3.20.2)
    runs-on: ubuntu-latest
    env:
      MIN_CMAKE: "3.20.2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential libssl-dev python3-venv

      - name: Install CMake ${{ env.MIN_CMAKE }}
        run: |
          python3 -m venv "$RUNNER_TEMP/cmake-venv"
          "$RUNNER_TEMP/cmake-venv/bin/pip" install --disable-pip-version-check "cmake==$MIN_CMAKE"
          echo "$RUNNER_TEMP/cmake-venv/bin" >> "$GITHUB_PATH"

      - name: Check CMake version
        run: |
          cmake --version
          test "$(cmake --version | head -n 1)" = "cmake version $MIN_CMAKE"
          test "$(ctest --version | head -n 1)" = "ctest version $MIN_CMAKE"

      - name: Configure and build
        run: cmake -S . -B build -G "Unix Makefiles" && cmake --build build

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Check tests were discovered
        # ctest exits 0 when it finds no tests; ctest --no-tests=error needs a
        # newer CMake than the 3.20.2 floor.
        run: |
          listing=$(ctest --test-dir build -N)
          printf '%s\n' "$listing"
          if printf '%s\n' "$listing" | grep -Eq 'Total Tests: 0'; then
            echo "::error::ctest found no tests."
            exit 1
          fi
          if ! printf '%s\n' "$listing" | grep -Eq 'Test +#[0-9]+:'; then
            echo "::error::ctest listed no Test # lines."
            exit 1
          fi

      - name: Build as a FetchContent consumer
        # A project that pulls this repository in with FetchContent links the
        # library only: it must not fetch googletest or define the test target.
        # The parent build's _deps are reused so nothing is downloaded twice.
        run: |
          deps="$GITHUB_WORKSPACE/build/_deps"
          consumer="$RUNNER_TEMP/consumer"
          mkdir -p "$consumer"
          cat > "$consumer/CMakeLists.txt" <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(ZeroBounceConsumer LANGUAGES CXX)
          include(FetchContent)
          FetchContent_Declare(zerobounce GIT_REPOSITORY https://example.invalid/zerobounce.git)
          FetchContent_MakeAvailable(zerobounce)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE ZeroBounce)
          EOF
          cat > "$consumer/main.cpp" <<'EOF'
          #include "ZeroBounce/ZeroBounce.h"

          int main() {
              ZeroBounce *(*instance)() = &ZeroBounce::getInstance;
              return instance == nullptr;
          }
          EOF
          cmake -S "$consumer" -B "$consumer/build" -G "Unix Makefiles" \
            -DFETCHCONTENT_FULLY_DISCONNECTED=ON \
            -DFETCHCONTENT_SOURCE_DIR_ZEROBOUNCE="$GITHUB_WORKSPACE" \
            -DFETCHCONTENT_SOURCE_DIR_CURL="$deps/curl-src" \
            -DFETCHCONTENT_SOURCE_DIR_CPR="$deps/cpr-src" \
            -DFETCHCONTENT_SOURCE_DIR_NLOHMANN_JSON="$deps/nlohmann_json-src"
          cmake --build "$consumer/build" --target consumer
          # Look for the cache entry of a FetchContent_MakeAvailable of googletest:
          # it exists only when the library's top-level guard is gone.
          if [ ! -f "$consumer/build/CMakeCache.txt" ]; then
            echo "::error::The FetchContent consumer has no CMakeCache.txt."
            exit 1
          fi
          if grep -E 'FETCHCONTENT_SOURCE_DIR_GOOGLETEST' "$consumer/build/CMakeCache.txt"; then
            echo "::error::A FetchContent consumer fetched googletest."
            exit 1
          fi
          if ! targets=$(cmake --build "$consumer/build" --target help); then
            echo "::error::cmake --build --target help failed in the FetchContent consumer."
            exit 1
          fi
          if printf '%s\n' "$targets" | grep -E 'ZeroBounceTests'; then
            echo "::error::A FetchContent consumer defines a test target."
            exit 1
          fi
